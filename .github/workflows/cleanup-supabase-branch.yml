name: Cleanup Supabase Branch

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    # Preview branches exist only for this repository's own branches; a fork's
    # PR gets no secrets and has nothing to clean up.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Delete Supabase preview branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The branch name is chosen by whoever opened the PR, so it is passed
          # as data, never expanded into the script.
          BRANCH: ${{ github.head_ref }}
        run: |
          supabase --experimental branches delete "$BRANCH" --project-ref ioczjdqhdcjmrnsicqqz || true
