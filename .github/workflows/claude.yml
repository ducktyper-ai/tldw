name: Claude Code

# Public repository: a run that holds the Claude token is never started by a
# comment, issue, review or pull request, because anyone on GitHub can write
# those. It starts only by hand (workflow_dispatch), which needs write access,
# from the Actions tab or `gh workflow run claude.yml -f prompt="..."`.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What Claude should do (name the issue or PR number in it)
        required: true
        type: string

permissions: {} # none by default; the job grants its own

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt is passed to the action as an input, never expanded into
          # a shell script.
          prompt: ${{ inputs.prompt }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
